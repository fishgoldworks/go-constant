name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '8.0.0'
      - run: echo "GO_CONSTANT_NODE8=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run docs
      - run: git diff --exit-code -- README.md docs/API.md
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
      - run: npm run verify:all
      - run: npm run build -- --check
      - id: archive
        name: Record the verified archive digest
        run: node scripts/check-ci-candidate.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.archive }}.sha256
          if-no-files-found: error
  contributor-floor:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '8.0.0'
      - run: echo "GO_CONSTANT_NODE8=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: artifacts
      - id: archive
        name: Check the producer archive digest
        env:
          EXPECTED_CANDIDATE_SHA256: ${{ needs.candidate.outputs.sha256 }}
        run: node scripts/check-ci-candidate.js "$EXPECTED_CANDIDATE_SHA256"
      - name: Verify contributor floor against the same candidate
        env:
          CANDIDATE_TARBALL: ${{ steps.archive.outputs.archive }}
        run: npm run verify -- --tarball "$CANDIDATE_TARBALL"
  consumers:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['12.17.0', '13.0.0', '14.0.0', '18.20.8', '22.16.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: echo "CONSUMER_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: artifacts
      - id: archive
        name: Check the producer archive digest
        env:
          EXPECTED_CANDIDATE_SHA256: ${{ needs.candidate.outputs.sha256 }}
        run: node scripts/check-ci-candidate.js "$EXPECTED_CANDIDATE_SHA256"
      - env:
          CANDIDATE_TARBALL: ${{ steps.archive.outputs.archive }}
        run: npm run test:package -- --tarball "$CANDIDATE_TARBALL" --node "$CONSUMER_NODE"
  typescript-compatibility:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        typescript: ['5.4.5', '5.8.3', '6.0.3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: artifacts
      - id: archive
        name: Check the producer archive digest
        env:
          EXPECTED_CANDIDATE_SHA256: ${{ needs.candidate.outputs.sha256 }}
        run: node scripts/check-ci-candidate.js "$EXPECTED_CANDIDATE_SHA256"
      - name: Install isolated compiler and the verified candidate
        shell: bash
        env:
          CANDIDATE_TARBALL: ${{ steps.archive.outputs.archive }}
        run: |
          npm install --prefix "$RUNNER_TEMP/type-compiler" --ignore-scripts --no-audit --no-fund --package-lock=false typescript@${{ matrix.typescript }}
          npm install --prefix "$RUNNER_TEMP/type-consumer" --offline --ignore-scripts --no-audit --no-fund --package-lock=false "$CANDIDATE_TARBALL"
      - name: Check shared inference and rejection fixtures
        run: npm run test:types -- --compiler "${{ runner.temp }}/type-compiler/node_modules/typescript/lib/tsc.js" --package "${{ runner.temp }}/type-consumer/node_modules/go-constant"
      - name: Repeat installed runtime and package checks with this compiler
        env:
          TYPESCRIPT_COMPILER: ${{ runner.temp }}/type-compiler/node_modules/typescript/lib/tsc.js
          GO_CONSTANT_TYPESCRIPT: ${{ runner.temp }}/type-compiler/node_modules/typescript/lib/tsc.js
          CANDIDATE_TARBALL: ${{ steps.archive.outputs.archive }}
        run: npm run test:package -- --tarball "$CANDIDATE_TARBALL"
